# The `primo-customization-cdn-*` images are built locally and never published to a
# registry, so a bare `docker compose pull` fails on them with "pull access denied".
# `pull_policy: never` makes `pull` skip them; `up` still builds them when absent.
x-build-e2e: &x-build-e2e
  image: primo-customization-cdn-e2e
  pull_policy: never
  build:
    context: ./
    dockerfile: e2e/Dockerfile
    cache_from:
      - primo-customization-cdn-e2e

x-environment: &x-environment
  VIEW: ${VIEW:-}

# Pinned IP for the real Ex Libris host, for services that proxy to production
# Ex Libris (currently e2e-tls). Defined once here so it only has to be updated
# in a single place if Ex Libris ever changes infrastructure.
x-exlibris-extra-hosts: &exlibris-extra-hosts
  - "nyu.primo.exlibrisgroup.com:216.147.212.109"

services:
  cdn-server:
    image: primo-customization-cdn-cdn-server
    pull_policy: never
    build:
      dockerfile: Dockerfile.cdn-server
    ports:
      - "3000:3000"
    networks:
      - primo-customization-cdn-net
    # volumes:
    #   - ./primo-customization:/app/cdn/primo-customization
  #  NOTE: This service name `primo-explore-devenv` is hard-coded into the view packages' `getCdn()` code.
  #        https://github.com/NYULibraries/primo-customization/blob/ffadff7421a150d84271bcee3bcb9f37e6ccf678/docker-compose.yml?#L115-#L116
  #        If changing this name, make sure to update that reference.
  primo-explore-devenv:
    image: quay.io/nyulibraries/primo-customization-devenv:main
    # Same as the image's default `primo-explore-devenv:run` script, plus
    # `--saml`, which makes sign-in work on localhost with no TLS or
    # `/etc/hosts` changes.
    #
    # `--saml` flips the three login rewrite rules in the devenv's
    # `gulp/primoProxy.js` from `[PL]` to `[RL]`:
    #   https://github.com/ExLibrisGroup/primo-explore-devenv/blob/226e3125310b72bb9a357f52524c98918956c6e3/gulp/primoProxy.js#L187-L195
    # With `[PL]` the devenv fetches the login endpoint server-side, so the
    # browser never navigates to Ex Libris and the SAML round trip cannot
    # complete; with `[RL]` the browser is redirected, authenticates at the IdP,
    # and returns to localhost with `?primoExploreJwt=...`.
    #
    # The flag is undocumented by Ex Libris.  It came in as a community
    # contribution in 2018: issue #83 reported that sign-in fails under SAML
    # because the proxied login request returns a 500, and PR #84 answered it by
    # adding `--saml` to redirect those requests instead.  Merged 2018-09-20.
    #   https://github.com/ExLibrisGroup/primo-explore-devenv/issues/83
    #   https://github.com/ExLibrisGroup/primo-explore-devenv/pull/84
    #   https://github.com/ExLibrisGroup/primo-explore-devenv/commit/624bd763
    # A later thread covers the same ground and is how most people run across it:
    #   https://github.com/ExLibrisGroup/primo-explore-devenv/issues/129
    #
    # There is also a `--cas` flag, for sites whose SSO is CAS rather than SAML.
    # We do not use it — NYU authenticates via Shibboleth/SAML — but it is worth
    # knowing about, because it sets the same `[RL]` rewrite flags and was added
    # for the same reason, in response to issue #86 — further confirmation that
    # redirecting is the intended way to sign in against a local devenv:
    #   https://github.com/ExLibrisGroup/primo-explore-devenv/commit/24863657
    #   https://github.com/ExLibrisGroup/primo-explore-devenv/issues/86
    #
    # The `[PL]`/`[RL]` flag vocabulary comes from connect-modrewrite:
    #   https://www.npmjs.com/package/connect-modrewrite
    #
    # We call the image's own npm script rather than inlining what it expands
    # to, so that changes to it upstream reach us — the image tag is `main`.
    #
    # The `--` is required.  Without it npm treats `--saml` as its own flag and
    # silently drops it, and the devenv then starts up looking perfectly normal;
    # you only discover the flag was lost when sign-in fails.
    command:
      - sh
      - -c
      - npm run primo-explore-devenv:run -- $$VIEW --saml
    ports:
      - "8003:8003"
    depends_on:
      - cdn-server
    environment:
      <<: *x-environment
    networks:
      primo-customization-cdn-net:
        aliases:
          - devenv

  e2e:
    <<: *x-build-e2e
    depends_on:
      e2e-tls:
        condition: service_healthy
    environment:
      <<: *x-environment
      PLAYWRIGHT_BASE_URL: https://e2e.nyu.primo.exlibrisgroup.com
    # https://playwright.dev/docs/ci#docker
    # CI configurations > Docker
    # "Using --ipc=host is also recommended when using Chromium. Without it Chromium can run out of memory and crash."
    ipc: host
    networks:
      - primo-customization-cdn-net
  e2e-update-golden-files:
    <<: *x-build-e2e
    depends_on:
      e2e-tls:
        condition: service_healthy
    environment:
      <<: *x-environment
      PLAYWRIGHT_BASE_URL: https://e2e.nyu.primo.exlibrisgroup.com
      UPDATE_GOLDEN_FILES: true
    ipc: host
    networks:
      - primo-customization-cdn-net
    # volumes:
    #   - ./e2e/tests/golden:/e2e/tests/golden
  e2e-update-screenshots:
    <<: *x-build-e2e
    depends_on:
      e2e-tls:
        condition: service_healthy
    command: ["yarn", "playwright", "test", "--update-snapshots"]
    environment:
      <<: *x-environment
      PLAYWRIGHT_BASE_URL: https://e2e.nyu.primo.exlibrisgroup.com
    ipc: host
    networks:
      - primo-customization-cdn-net
    # volumes:
    #   - ./e2e/tests/chat-widget.spec.js-snapshots/:/e2e/tests/chat-widget.spec.js-snapshots/

  e2e-tls:
    image: primo-customization-cdn-e2e-tls-nginx
    build:
      dockerfile: Dockerfile.nginx-e2e
    ports:
      - "444:443"
    depends_on:
      - primo-explore-devenv
      - cdn-server
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -ksf https://localhost/healthz -H 'Host: e2e.nyu.primo.exlibrisgroup.com'",
        ]
      start_period: 60s
      interval: 5s
      timeout: 5s
      retries: 12
    extra_hosts: *exlibris-extra-hosts
    networks:
      primo-customization-cdn-net:
        aliases:
          - e2e.nyu.primo.exlibrisgroup.com

networks:
  primo-customization-cdn-net:
    driver: bridge
